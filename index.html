<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metatronik Sales — Sign in</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <div class="auth-wrap">
    <h1>Metatronik Sales</h1>
    <p class="muted">Daily sales and orders</p>

    <div id="switchedOff" class="card hidden">
      <h2>Your account is not active</h2>
      <p>Please ask the owner to switch your account on.</p>
      <button class="secondary" onclick="signOut()">Sign out</button>
    </div>

    <div id="authCard" class="card hidden">
      <div class="tabs">
        <button id="tabIn" type="button">Sign in</button>
        <button id="tabUp" type="button" class="secondary">New account</button>
      </div>

      <form id="authForm">
        <div class="field hidden" id="nameField">
          <label for="fullName">Your name</label>
          <input id="fullName" autocomplete="name">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" minlength="6" required>
        </div>
        <button type="submit" id="submitBtn" style="width:100%">Sign in</button>
      </form>
      <div id="msg"></div>
      <p class="small muted" id="signupNote" style="display:none">New accounts start as Staff (view only). The owner can change this.</p>
    </div>
  </div>

<script>
let mode = 'in';
const $ = id => document.getElementById(id);

function setMode(m) {
  mode = m;
  $('tabIn').className = m === 'in' ? '' : 'secondary';
  $('tabUp').className = m === 'up' ? '' : 'secondary';
  $('nameField').classList.toggle('hidden', m === 'in');
  $('signupNote').style.display = m === 'up' ? 'block' : 'none';
  $('submitBtn').textContent = m === 'in' ? 'Sign in' : 'Create account';
  $('password').autocomplete = m === 'in' ? 'current-password' : 'new-password';
  showMsg($('msg'), '');
}
$('tabIn').onclick = () => setMode('in');
$('tabUp').onclick = () => setMode('up');

async function goIfSignedIn() {
  let me = null;
  try { me = await getProfile(); } catch (e) { me = null; }
  if (me && me.profile && me.profile.active) {
    window.location.replace('dashboard.html' + window.location.search);
    return true;
  }
  if (me) { $('switchedOff').classList.remove('hidden'); return true; }
  return false;
}

$('authForm').onsubmit = async (e) => {
  e.preventDefault();
  const email = $('email').value.trim();
  const password = $('password').value;
  $('submitBtn').disabled = true;
  try {
    if (mode === 'in') {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await goIfSignedIn();
    } else {
      const { data, error } = await sb.auth.signUp({
        email, password,
        options: {
          data: { full_name: $('fullName').value.trim() },
          emailRedirectTo: window.location.origin + '/index.html',
        },
      });
      if (error) throw error;
      if (data.session) { await goIfSignedIn(); }
      else {
        showMsg($('msg'), 'Account created. Please check your email and click the confirmation link, then sign in here.', 'ok');
        setMode('in');
        showMsg($('msg'), 'Account created. Please check your email and click the confirmation link, then sign in here.', 'ok');
      }
    }
  } catch (err) {
    showMsg($('msg'), friendlyError(err), 'error');
  } finally {
    $('submitBtn').disabled = false;
  }
};

(async () => {
  if (!(await goIfSignedIn())) $('authCard').classList.remove('hidden');
})();
</script>
</body>
</html>
